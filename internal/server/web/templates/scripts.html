{{define "scripts.html"}}
{{template "head" .}}

<section class="split">
  <div class="panel">
    <div class="panel-head">
      <h2>Scripts</h2>
      <button id="new-script">New</button>
    </div>
    <ul class="script-list" id="script-list">
      <li class="muted pad">Loading…</li>
    </ul>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2 id="editor-title">New script</h2>
      <span class="muted" id="script-hash"></span>
    </div>
    <form id="script-form" class="editor">
      <input type="hidden" id="script-id">
      <div class="editor-row">
        <label for="script-name">Name</label>
        <input type="text" id="script-name" required placeholder="restart-print-spooler">
      </div>
      <div class="editor-row">
        <label for="script-desc">Description</label>
        <input type="text" id="script-desc" placeholder="what this fixes, and when to run it">
      </div>
      <div class="editor-row split-row">
        <div>
          <label for="script-interpreter">Interpreter</label>
          <select id="script-interpreter">
            <option value="sh">sh — Linux &amp; macOS</option>
            <option value="powershell">powershell — Windows</option>
          </select>
        </div>
        <div>
          <label for="script-timeout">Timeout</label>
          <input type="number" id="script-timeout" min="1" max="3600" value="300"> <span class="unit">sec</span>
        </div>
      </div>
      <div class="editor-row">
        <label for="script-content">Script</label>
        <textarea id="script-content" rows="14" spellcheck="false" required
          placeholder="#!/bin/sh&#10;set -eu&#10;echo &quot;disk usage:&quot;&#10;df -h /"></textarea>
      </div>
      <div class="editor-actions">
        <button type="submit" class="primary">Save</button>
        <button type="button" id="delete-script" class="danger" hidden>Delete</button>
      </div>
    </form>
  </div>
</section>

<p class="note">
  Scripts are managed here and run from a device's page. Open a device from the
  <a href="/">dashboard</a> to dispatch one.
</p>

{{template "foot" .}}
{{end}}
